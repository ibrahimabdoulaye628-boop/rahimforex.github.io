<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Rahim Forex</title>
<style>
body{background:#0A1F44;color:white;font-family:sans-serif;padding:20px;}
input{padding:8px;margin:5px 0;display:block;width:100%;border-radius:5px;border:none;font-size:16px;}
button{padding:10px 20px;margin-top:10px;background:#4DA3FF;border:none;color:white;font-weight:600;cursor:pointer;border-radius:5px;}
h2{margin-bottom:20px;}
#adminPanel{display:none;}
</style>
</head>
<body>

<h2>Admin Panel - Rahim Forex Exchange</h2>

<label>Password:</label>
<input type="password" id="pass" placeholder="Enter password">
<button onclick="login()">Login</button>

<div id="adminPanel">
    <h3>Update Exchange Rates</h3>
    <div id="ratesInputs"></div>
    <button onclick="updateRates()">Save Rates</button>
</div>

<script>
const currencies = ["USD","EUR","GBP","AED","CFA","GHS"];
const webAppUrl = "VOTRE_URL_WEB_APP_ICI"; // Remplace par l’URL de ton Google Apps Script

// Fonction login
function login(){
    const password = document.getElementById("pass").value;
    if(password === "rahim2026"){ 
        document.getElementById("adminPanel").style.display="block";
        document.getElementById("pass").style.display="none";
        alert("Welcome Admin");
        renderInputs();
    } else {
        alert("Wrong Password");
    }
}

// Crée les champs Buy / Sell pour chaque devise
function renderInputs(){
    const container = document.getElementById("ratesInputs");
    container.innerHTML="";
    currencies.forEach(c=>{
        container.innerHTML+=`
        <label>${c} Buy:</label><input type="number" id="${c}buy" value=""><br>
        <label>${c} Sell:</label><input type="number" id="${c}sell" value=""><br>`;
    });
}

// Envoyer les taux au Google Sheet via Apps Script
function updateRates(){
    const data = currencies.map(c=>{
        return {
            currency:c,
            buy:parseFloat(document.getElementById(c+"buy").value),
            sell:parseFloat(document.getElementById(c+"sell").value)
        }
    });

    fetch(webAppUrl,{
        method:"POST",
        body: JSON.stringify(data)
    }).then(res=>res.json())
    .then(res=>{
        if(res.status==="success"){
            alert("Rates updated successfully!");
        } else {
            alert("Error updating rates");
        }
    }).catch(err=>{
        alert("Error: "+err);
    });
}
</script>

</body>
</html>
